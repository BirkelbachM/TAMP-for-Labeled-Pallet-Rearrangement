<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>iPhone MP4 diagnostic</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:20px;line-height:1.45;color:#111}
video{width:100%;max-width:520px;background:#ddd;display:block;margin:10px 0 20px}
pre{white-space:pre-wrap;word-break:break-word;background:#f3f3f3;padding:12px;border-radius:8px;font-size:12px}
button{font-size:16px;padding:10px 14px;margin:5px 5px 15px 0}
section{margin-bottom:32px}
</style>
</head>
<body>
<h1>iPhone MP4 diagnostic</h1>
<p>This page tests the same MP4 in two ways: directly in &lt;video&gt;, and via fetch() → Blob.</p>

<section>
<h2>1. Direct video source</h2>
<video id="direct" controls muted playsinline preload="metadata"
       src="assets/engagement/video/S01_rho2p5_seed20.mp4"></video>
<button id="directPlay">Play direct video</button>
<pre id="directLog">waiting...</pre>
</section>

<section>
<h2>2. Fetch → Blob source</h2>
<video id="blobVideo" controls muted playsinline preload="metadata"></video>
<button id="blobLoad">Fetch, load and play Blob</button>
<pre id="blobLog">waiting...</pre>
</section>

<script>
const src = "assets/engagement/video/S01_rho2p5_seed20.mp4";

function mediaErrorText(video) {
  if (!video.error) return "none";
  const names = {
    1: "MEDIA_ERR_ABORTED",
    2: "MEDIA_ERR_NETWORK",
    3: "MEDIA_ERR_DECODE",
    4: "MEDIA_ERR_SRC_NOT_SUPPORTED"
  };
  return `${video.error.code} (${names[video.error.code] || "unknown"})`;
}

function state(video) {
  return [
    `currentSrc: ${video.currentSrc || "(empty)"}`,
    `error: ${mediaErrorText(video)}`,
    `networkState: ${video.networkState}`,
    `readyState: ${video.readyState}`,
    `paused: ${video.paused}`,
    `duration: ${Number.isFinite(video.duration) ? video.duration : String(video.duration)}`
  ].join("\n");
}

function watch(video, log) {
  const events = ["loadstart","loadedmetadata","loadeddata","canplay","canplaythrough","play","playing","pause","stalled","suspend","waiting","abort","emptied","error"];
  const history = [];
  function render(ev) {
    if (ev) history.push(ev.type);
    if (history.length > 20) history.shift();
    log.textContent = state(video) + `\n\nevents: ${history.join(" → ")}`;
  }
  for (const name of events) video.addEventListener(name, render);
  render();
}

const direct = document.getElementById("direct");
const directLog = document.getElementById("directLog");
watch(direct, directLog);
document.getElementById("directPlay").addEventListener("click", async () => {
  try {
    direct.muted = true;
    await direct.play();
  } catch (e) {
    directLog.textContent += `\n\nplay() rejected: ${e.name}: ${e.message}`;
  }
});

const blobVideo = document.getElementById("blobVideo");
const blobLog = document.getElementById("blobLog");
watch(blobVideo, blobLog);
let oldBlobUrl = null;

document.getElementById("blobLoad").addEventListener("click", async () => {
  blobLog.textContent = "fetching...";
  try {
    const response = await fetch(src, { cache: "no-store" });
    const ct = response.headers.get("content-type");
    const cl = response.headers.get("content-length");
    const ar = response.headers.get("accept-ranges");
    const cr = response.headers.get("content-range");
    const buf = await response.arrayBuffer();
    const first = Array.from(new Uint8Array(buf.slice(0, 16))).map(x => x.toString(16).padStart(2,"0")).join(" ");

    if (oldBlobUrl) URL.revokeObjectURL(oldBlobUrl);
    const blob = new Blob([buf], { type: "video/mp4" });
    oldBlobUrl = URL.createObjectURL(blob);
    blobVideo.src = oldBlobUrl;
    blobVideo.muted = true;
    blobVideo.load();

    blobLog.textContent = [
      `fetch status: ${response.status}`,
      `content-type: ${ct}`,
      `content-length: ${cl}`,
      `accept-ranges: ${ar}`,
      `content-range: ${cr}`,
      `downloaded bytes: ${buf.byteLength}`,
      `first 16 bytes: ${first}`,
      `blob type: ${blob.type}`,
      `blob size: ${blob.size}`,
      `blob URL: ${oldBlobUrl}`,
      "",
      state(blobVideo)
    ].join("\n");

    blobVideo.addEventListener("loadedmetadata", async function once() {
      blobVideo.removeEventListener("loadedmetadata", once);
      try {
        await blobVideo.play();
      } catch (e) {
        blobLog.textContent += `\n\nplay() rejected: ${e.name}: ${e.message}`;
      }
    });
  } catch (e) {
    blobLog.textContent = `FETCH/BLOB FAILED\n${e.name}: ${e.message}`;
  }
});
</script>
</body>
</html>
